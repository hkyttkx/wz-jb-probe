name: Build JBProbe

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install xcodegen ldid

      - name: Generate Xcode project
        run: |
          xcodegen generate
          # xcodegen 会生成 Xcode 16 的格式(77)，runner 是 Xcode 15，需降级
          PBX=WZJBProbe.xcodeproj/project.pbxproj
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' "$PBX"
          sed -i '' 's/compatibilityVersion = "Xcode 16.0";/compatibilityVersion = "Xcode 14.0";/' "$PBX"
          grep -E 'objectVersion|compatibilityVersion' "$PBX" | head -4
          ls -la

      - name: Build (no code sign)
        run: |
          xcodebuild \
            -project WZJBProbe.xcodeproj \
            -target WZJBProbe \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/out" \
            build
          echo "--- 产物 ---"
          ls -la out/ || true

      - name: Locate app bundle
        run: |
          APP="$PWD/out/WZJBProbe.app"
          if [ ! -d "$APP" ]; then
            echo "未找到 WZJBProbe.app，搜索整个 out/"
            find out -name "*.app" -type d
            exit 1
          fi
          echo "APP_PATH=$APP" >> $GITHUB_ENV

      - name: Pseudo-sign with ldid
        run: |
          set -e
          APP="${{ env.APP_PATH }}"
          echo "APP=$APP"
          # 全部放顶层，并把 install_name 统一改成 @loader_path/
          # （@rpath/ 和 @executable_path/Frameworks/ 在 TrollStore 重装后易解析失败）
          cp Vendor/libchoma.dylib Vendor/libxpf.dylib Vendor/libgrabkernel2.dylib "$APP/"
          for d in libchoma libxpf libgrabkernel2; do
            install_name_tool -id "@loader_path/$d.dylib" "$APP/$d.dylib" || true
          done
          BIN="$APP/$(basename $APP .app)"
          install_name_tool -change @rpath/libgrabkernel2.dylib @loader_path/libgrabkernel2.dylib "$BIN" || true
          install_name_tool -change @executable_path/Frameworks/libxpf.dylib @loader_path/libxpf.dylib "$BIN" || true
          install_name_tool -change @loader_path/libxpf.dylib @loader_path/libxpf.dylib "$BIN" || true
          echo "--- 布置结果 ---"
          # 校验每个依赖是否能被 dyld 解析
          otool -L "$APP/$(basename $APP .app)" | head -20 || true
          # install_name_tool 会破坏签名，dylib 全部重新伪签名
          for d in libchoma libxpf libgrabkernel2; do
            ldid -S "$APP/$d.dylib" || true
          done
          ldid -SEntitlements.plist "$APP/$(basename $APP .app)"
          echo "--- 已签名的 entitlements ---"
          ldid -e "$APP/$(basename $APP .app)" | head -40 || true
          ls -la "$APP/"

      - name: Package IPA
        run: |
          set -e
          APP="${{ env.APP_PATH }}"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry WZJBProbe.ipa Payload
          ls -la WZJBProbe.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WZJBProbe-ipa
          path: WZJBProbe.ipa
          if-no-files-found: error
