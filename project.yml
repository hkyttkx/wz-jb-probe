#
# xcodegen 工程描述
# CI 里执行 `xcodegen generate` 生成 WZJBProbe.xcodeproj
#
name: WZJBProbe
options:
  bundleIdPrefix: com.wz
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # RemoteCall/libjailbreak 需要 arm64e（PAC 能力）
    ARCHS: arm64e
    ONLY_ACTIVE_ARCH: NO
    ENABLE_BITCODE: NO
    CLANG_ENABLE_MODULES: YES
    CLANG_CXX_LANGUAGE_STANDARD: gnu++17
    GCC_C_LANGUAGE_STANDARD: gnu11

targets:
  WZJBProbe:
    type: application
    platform: iOS
    sources:
      - path: sources
      - path: Vendor/imgui
      - path: Resources
    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: CoreGraphics.framework
      - sdk: QuartzCore.framework
      - sdk: IOKit.framework
      - sdk: Security.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Entitlements.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.wz.jbprobe
        PRODUCT_NAME: WZJBProbe
        HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/sources
        # 不再链接 dylib：改为运行时扫描 jbroot + dlopen 设备上那份
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path
        # 关闭对私有 API 的检查（我们用了大量 SPI）
        CLANG_WARN_DOCUMENTATION_COMMENTS: NO
